name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project (with dev + cli extras)
        run: uv pip install -e ".[dev,cli]"

      - name: Install PyTorch (CPU) for ML tests
        if: matrix.python-version == '3.12'
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Run tests with coverage
        run: uv run pytest --cov=imgw_meteo --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create virtual environment
        run: uv venv --python 3.12
      - name: Install project (with dev extras)
        run: uv pip install -e ".[dev]"
      - name: Type check (mypy)
        run: uv run mypy src/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create virtual environment
        run: uv venv --python 3.12
      - name: Install project (with docs extras)
        run: uv pip install -e ".[docs]"
      - name: Build docs (warnings as errors)
        run: uv run sphinx-build -b html -W docs docs/_build/html
