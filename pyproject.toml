[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgw-meteo"
version = "0.1.0"
description = "Download, standardize and query IMGW (Poland) meteorological measurement data, with PyTorch dataloaders."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Wojciech Fiołka" }]
requires-python = ">=3.12"
keywords = ["imgw", "meteorology", "weather", "poland", "dataset", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.0"]
torch = ["torch>=2.0"]
tf = ["tensorflow>=2.13"]
all = ["typer>=0.12", "rich>=13.0", "torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
imgw-meteo = "imgw_meteo.cli:main"

[project.urls]
Homepage = "https://github.com/wfiolka/imgw-meteo"
Source = "https://github.com/wfiolka/imgw-meteo"

[tool.hatch.build.targets.wheel]
packages = ["src/imgw_meteo"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
